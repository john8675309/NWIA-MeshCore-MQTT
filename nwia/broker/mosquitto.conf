# Copy to the broker server and replace paths as needed.
# No anonymous access; no unencrypted listener.
listener 8883
protocol mqtt
allow_anonymous false
password_file /etc/mosquitto/nwia.passwd
acl_file /etc/mosquitto/nwia.acl
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem
tls_version tlsv1.2
persistence false
# Replay is unwanted. Retained packets are forbidden on this dedicated broker.
retain_available false
max_packet_size 512
max_inflight_messages 4
max_queued_messages 4
connection_messages true
log_type error
log_type warning
log_type notice
