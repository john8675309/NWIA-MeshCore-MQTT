; NWIA build: USB configuration, standalone Wi-Fi MQTT transport.
[env:Heltec_v3_nwia_mqtt]
extends = env:Heltec_v3_repeater
build_flags =
  ${env:Heltec_v3_repeater.build_flags}
  -D NWIA_MQTT=1
  -D DISABLE_WIFI_OTA=1
  -D ESP32_CPU_FREQ=240
  -D LORA_FREQ=910.525
  -D LORA_SF=7
build_unflags =
  ${sensor_base.build_flags}
  -D ESP32_CPU_FREQ=80
  -D LORA_FREQ=869.618
  -D LORA_SF=8
build_src_filter =
  ${env:Heltec_v3_repeater.build_src_filter}
  +<helpers/bridges/NwiaMqtt.cpp>
lib_deps =
  SPI
  Wire
  bblanchon/ArduinoJson @ 7.4.3
; Third-party libraries vendored under lib/NWIA_*; see nwia/vendor-lock.json.
